name: Build Cyrene Launcher

on:
  push:
    branches:
      - cyrene-launcher
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyrene-launcher-build
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/cyrene-launcher'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.59

      - name: Build Windows executable
        run: wails3 task build
        env:
          PRODUCTION: "true"

      - name: Verify build output
        run: |
          if (!(Test-Path "bin/Cyrene-launcher.exe")) {
            throw "Expected build output bin/Cyrene-launcher.exe was not produced."
          }

      - name: Publish executable to Hoyo release
        uses: softprops/action-gh-release@v2
        with:
          repository: horoyoi-san/Hoyo
          token: ${{ secrets.HOYO_RELEASE_TOKEN }}
          tag_name: hkrpg
          files: bin/Cyrene-launcher.exe
          overwrite_files: true
          fail_on_unmatched_files: true
